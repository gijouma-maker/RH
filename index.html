<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH – Umbau 3D (Variante 5)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe6ec;font-family:Arial,Helvetica,sans-serif}
  #c{display:block;width:100%;height:100%}
  #panel{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.93);border-radius:10px;
         padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:13px;max-width:250px}
  #panel h1{font-size:15px;margin:0 0 6px}
  #panel label{display:block;margin:4px 0;cursor:pointer}
  #panel input[type=range]{width:100%}
  #toggle{position:absolute;top:10px;right:10px;border:0;border-radius:8px;padding:8px 12px;
          background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}
  .lg i{display:inline-block;width:14px;height:10px;border:1px solid #555}
  .hint{font-size:11px;color:#666;margin-top:6px}
  .views button{font-size:12px;margin:2px 2px 0 0;padding:4px 7px;border:1px solid #bbb;border-radius:6px;background:#f7f7f7}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle">Menü</button>
<div id="panel">
  <h1>RH – Umbau Variante 5</h1>
  <label><input type="checkbox" id="kg" checked> Keller</label>
  <label><input type="checkbox" id="eg" checked> Erdgeschoss + Anbau</label>
  <label><input type="checkbox" id="dg" checked> Dachgeschoss</label>
  <label><input type="checkbox" id="roof" checked> Dach</label>
  <label><input type="checkbox" id="ground" checked> Erdreich</label>
  <label><input type="checkbox" id="furn" checked> Möbel (skandinavisch)</label>
  <label><input type="checkbox" id="labels" checked> Raumnamen</label>
  <label>Etagen auseinander
    <input type="range" id="explode" min="0" max="4" step="0.1" value="0"></label>
  <div class="views">
    <button data-v="iso">3D</button><button data-v="front">Vorne</button>
    <button data-v="top">Von oben</button><button data-v="stair">Treppe</button>
  </div>
  <div style="margin-top:8px">
    <div class="lg"><i style="background:#2f3336"></i>Treppe Stahl (anthrazit)</div>
    <div class="lg"><i style="background:#c8a06a"></i>Stufen Eiche</div>
    <div class="lg"><i style="background:#2bb39a"></i>Kellertreppe (eingemauert)</div>
    <div class="lg"><i style="background:#f39c12"></i>Fallleitung DG-Bad → Keller</div>
    <div class="lg"><i style="background:#5dade2"></i>Fenster (dunkelblau = neu)</div>
  </div>
  <div class="hint">Drehen: ziehen · Zoom: scrollen/zwei Finger · Verschieben: rechte Maus/zwei Finger</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
